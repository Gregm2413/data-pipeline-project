name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Python linting ──────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ tests/

  # ── Job 2: Python unit tests ───────────────────────────────────────────────
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install -r src/requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  # ── Job 3: dbt compile + docs (no live Databricks connection needed) ───────
  dbt-validate:
    name: dbt Compile & Docs
    runs-on: ubuntu-latest
    env:
      # Stored as GitHub repository secrets:
      #   Settings → Secrets and variables → Actions → New repository secret
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-databricks
        run: pip install dbt-databricks

      - name: dbt deps
        working-directory: olist_retail
        run: dbt deps

      - name: dbt compile (syntax + model graph validation)
        working-directory: olist_retail
        run: dbt compile --profiles-dir .
        # compile parses all SQL/YAML and resolves refs — no live DB needed

      - name: dbt docs generate (manifest only — no catalog introspection)
        working-directory: olist_retail
        run: dbt docs generate --profiles-dir . --no-compile
        # --no-compile reuses the manifest from the compile step above.
        # catalog.json (schema introspection) is skipped because the cluster
        # may be stopped. The docs site still renders with model/column docs.
        continue-on-error: true  # don't fail PR if cluster happens to be off

      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: olist_retail/target/
          retention-days: 14